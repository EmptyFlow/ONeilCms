<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>App Drawer</title>
</head>
<body>
	<div id="list">

	</div>
	<script type="module">
		function init() {
			let appsjson = '';
			const list = document.getElementById('list');
			if (!appsjson) return;
	
			const items = JSON.parse(appsjson);

			for (const item of items) {
				const listItem = document.createElement("div");
				listItem.innerHTML = `<a href=''></span>`;
				list.appendChild(listItem);
			}
		}		
	</script>
</body>
</html>
