<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Sign in to your account</title>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		@font-face {
			font-family: "Roboto";
			src: url("./Roboto.ttf") format("truetype");
			font-weight: 400;
			font-style: normal;
			font-display: swap;
		}

		body {
			font-family: "Roboto", Arial, sans-serif;
			margin: 0;
		}

		.all-page-container {
			width: 100vw;
			height: 100vh;
			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: center;
			background-color: #ADF5FF;
		}

		.form-container {
			width: 300px;
			display: flex;
			flex-direction: column;
			padding: 10px;
			border: 1px solid #0075A2;
			border-radius: 4px;
			background-color: white;
		}

		.form-header {
			font-size: 22px;
			height: 50px;
			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: center;
		}

		.form-label {
			font-size: 17px;
			margin-top: 4px;
			margin-bottom: 4px;
		}

		.form-input {
			font-size: 15px;
			margin-bottom: 8px;
		}

		.form-button {
			font-size: 17px;
			font-weight: bold;
			margin-top: 10px;
		}
	</style>
</head>
<body>
	<div class="all-page-container">
		<div id="form" class="form-container">
			<div style="display: flex; flex-direction: row; align-items: center;">
				<div style="width: 80px; height: 80px; display: flex; flex-direction: row; align-items: center; justify-content: center; margin-left: 8px; ">
					<img src="/favicon.svg" width="50" height="50" />
				</div>
				<span style="font-size: 26px; margin-left: 10px; color: #0075A2; ">WebApplaud</span>
			</div>
			<div class="form-header"><span>Sign in to your account</span></div>
			<span class="form-label">User Name</span>
			<input id="username" class="form-input" type="text" value="" placeholder="Enter username" />
			<span class="form-label">Password</span>
			<input id="password" class="form-input" type="password" value="" placeholder="Enter your password" />
			<button class="form-button" id="submitButton">Submit</button>
		</div>
	</div>

	<script type="module">
		function init() {
			const form = document.getElementById('form');
			const button = document.getElementById('submitButton');

			button.addEventListener('click', formSubmit);
		}

		async function formSubmit() {
			const userName = document.getElementById('username');
			const password = document.getElementById('password');
			const login = userName.value;
			const pass = password.value;

			if (!login || !pass) return;

			const formData = new FormData();
			formData.append("login", login);
			formData.append("password", pass);
			const response = await fetch("/login", {
				method: "POST",
				body: formData
			});
		}

		init();
	</script>
</body>
</html>
